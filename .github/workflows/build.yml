# Checks chronalert.com daily for a new release. When the version on the
# download page isn't on GHCR yet, downloads the AppImage, builds the image,
# tests it and pushes it as both :<version> and :latest.
# Pull requests build and test the image but never push it.
name: Build and push ChronAlert image

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this version is already published
        type: boolean
        default: false
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/rodzillanh/chronalert
  DOWNLOAD_PAGE: https://chronalert.com/download
  APPIMAGE_URL: https://chronalert.com/download/ChronAlert-x86_64.AppImage

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Find the current ChronAlert version
        id: version
        run: |
          version=$(curl -fsSL "$DOWNLOAD_PAGE" | grep -oE 'Version [0-9]+\.[0-9]+\.[0-9]+' | head -1 | cut -d' ' -f2)
          if [ -z "$version" ]; then
            echo "::error::Couldn't find 'Version x.y.z' on $DOWNLOAD_PAGE"
            exit 1
          fi
          echo "Current version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to build and push
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "Pull request: build and test only."
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif [ "$FORCE" != "true" ] && docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION already exists, nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the AppImage
        if: steps.check.outputs.build == 'true'
        run: curl -fsSL -o ChronAlert-x86_64.AppImage "$APPIMAGE_URL"

      - uses: docker/setup-buildx-action@v4
        if: steps.check.outputs.build == 'true'

      - name: Build
        uses: docker/build-push-action@v7
        if: steps.check.outputs.build == 'true'
        with:
          context: .
          load: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: chronalert:test

      - name: Test the image
        if: steps.check.outputs.build == 'true'
        run: |
          fail() { echo "::error::$1"; docker logs chronalert || true; exit 1; }

          # Start with root-owned data, like an install from before the switch to 99:100
          mkdir data
          sudo touch data/existing-file
          sudo chown -R root:root data

          docker run -d --name chronalert -p 8420:8420 -v "$PWD/data:/data" chronalert:test

          echo "Waiting for the health check to pass..."
          for i in $(seq 1 36); do
            status=$(docker inspect -f '{{.State.Health.Status}}' chronalert)
            [ "$status" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' chronalert)" = true ] || fail "Container stopped"
            sleep 5
          done
          [ "$status" = healthy ] || fail "Health check is '$status' after 3 minutes"
          curl -sS -o /dev/null -w 'Dashboard answered with HTTP %{http_code}\n' http://127.0.0.1:8420/

          docker top chronalert -eo pid,uid,gid,args
          docker top chronalert -eo pid,uid,args | grep -qE '^\s*[0-9]+\s+99\s+/opt/chronalert/chronalert' \
            || fail "ChronAlert is not running as UID 99"
          owner=$(stat -c %u:%g data/existing-file)
          [ "$owner" = 99:100 ] || fail "Existing data is owned by $owner, expected 99:100"
          ls -ln data

          start=$(date +%s)
          docker stop chronalert >/dev/null
          took=$(( $(date +%s) - start ))
          code=$(docker inspect -f '{{.State.ExitCode}}' chronalert)
          echo "Stopped in ${took}s with exit code $code"
          [ "$code" != 137 ] || fail "ChronAlert ignored the stop signal and had to be killed"

      - name: Push
        uses: docker/build-push-action@v7
        if: steps.check.outputs.push == 'true'
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
